<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PixelCasino · Казино для развлечения</title>
  <meta name="description" content="Красивое пиксельное казино для развлечения — слоты, рулетка, блэкджек, краш, плинко и другое. Виртуальные кредиты, без реальных денег." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>" />
</head>
<body>
  <div class="bg-layer"></div>
  <div class="scanlines"></div>

  <header class="topbar">
    <button class="brand" id="homeBtn">
      <span class="brand-ic">🎰</span>
      <span class="brand-txt">PIXEL<b>CASINO</b></span>
    </button>

    <div class="hud">
      <div class="hud-level" title="Уровень">
        <span class="lvl-badge">LV <b id="levelNum">1</b></span>
        <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      </div>
      <div class="hud-best" title="Лучший выигрыш">🏆 <span id="bestWin">0</span></div>
      <div class="hud-balance" title="Баланс">
        <span class="coin-ic">🪙</span>
        <span class="bal-num" id="balance">1000</span>
      </div>
      <button class="hud-bonus" id="bonusBtn" title="Получить бонус">🎁 Бонус</button>
    </div>

    <div class="controls">
      <button class="ico-btn" id="musicBtn" title="Музыка">🎵</button>
      <button class="ico-btn" id="muteBtn" title="Звук">🔊</button>
      <button class="ico-btn" id="resetBtn" title="Сброс">↻</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div id="toasts" class="toasts"></div>
  <div id="fx-coins" class="fx-coins"></div>
  <canvas id="fx-canvas" class="fx-canvas"></canvas>

  <script src="js/audio.js"></script>
  <script src="js/core.js"></script>
  <script src="js/games/slots.js"></script>
  <script src="js/games/roulette.js"></script>
  <script src="js/games/blackjack.js"></script>
  <script src="js/games/plinko.js"></script>
  <script src="js/games/crash.js"></script>
  <script src="js/games/mines.js"></script>
  <script src="js/games/wheel.js"></script>
  <script src="js/games/instant.js"></script>
  <script src="js/games/cards.js"></script>
  <script src="js/games/keno.js"></script>
  <script src="js/games/scratch.js"></script>
  <script src="js/games/sicbo.js"></script>
  <script src="js/games/limbo.js"></script>
  <script src="js/games/tower.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
